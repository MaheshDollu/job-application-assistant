spring:
  application:
    name: job-application-assistant
  ai:
    ollama:
      base-url: http://localhost:11434
      chat:
        options:
          model: llama3
          # Default temperature — overridden per-node in code
          # Analytical nodes use 0.1, creative nodes use 0.6
          temperature: 0.1

server:
  port: 8080

logging:
  level:
    com.mahesh: DEBUG
    org.bsc.langgraph4j: INFO
